
name: Build Deepavali Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V31 Android project
        run: unzip -q DeepavaliSiruSemippu_Android_Project_V31-2.zip -d project

      - name: Verify V31 HTML
        run: |
          test -f project/app/src/main/assets/index.html
          echo "V31 HTML found successfully"
          wc -c project/app/src/main/assets/index.html

      - name: Build APK
        run: gradle -p project assembleDebug

      - name: Upload V31 APK
        uses: actions/upload-artifact@v4
        with:
          name: Deepavali-SiruSemippu-V31-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
